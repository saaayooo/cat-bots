<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Кошачий Хаб 🐱</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="cats-avatars">
          <span class="cat-badge" id="cat1-emoji">🐈‍⬛</span>
          <span class="cat-badge offset" id="cat2-emoji">🐈‍⬛</span>
        </div>
        <div>
          <h1 class="header-title" id="cats-names">Туча & Грунтик</h1>
          <p class="header-subtitle" id="last-fed-info">Загрузка данных...</p>
        </div>
      </div>
      <div class="streak-badge" id="streak-badge" title="Серия дней заботы">
        <span class="fire-icon">🔥</span>
        <span id="streak-days">0</span>
      </div>
    </header>

    <!-- Main Content / Tamagotchi -->
    <main class="main-content">
      <!-- Tamagotchi Hero Card -->
      <section class="tamagotchi-card">
        <div class="cat-hero-visual">
          <div class="cat-animation-wrapper" id="cat-animation">
            <div class="cat-face-circle" id="cat-mood-avatar">🥰</div>
            <div class="cat-sleeping-zzz" id="cat-zzz">zzz...</div>
          </div>
        </div>

        <div class="mood-box">
          <div class="mood-title" id="mood-title">Счастливы и мурчат</div>
          <div class="mood-desc" id="mood-desc">Оба котика сыты и довольны!</div>
        </div>

        <!-- Satiety Gauge -->
        <div class="gauge-container">
          <div class="gauge-header">
            <span class="gauge-label">Сытость котиков</span>
            <span class="gauge-value" id="satiety-val">100%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="satiety-bar" style="width: 100%;"></div>
          </div>
        </div>

        <!-- Quick Feed Action Button -->
        <button class="btn-primary" id="btn-quick-feed" type="button">
          <span class="btn-icon">🥣</span>
          <span id="feed-btn-text">Покормить котиков в 1 клик</span>
        </button>
      </section>

      <!-- Clickable Vital Stats Care Grid -->
      <section class="care-section">
        <div class="section-title">Ежедневная забота</div>
        <div class="stats-grid">
          <!-- Water Button -->
          <button class="stat-card action-card" id="btn-care-water" type="button">
            <div class="stat-header">
              <span class="stat-icon">💧</span>
              <span class="stat-title">Вода</span>
            </div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill water-bar" id="water-bar" style="width: 100%;"></div>
            </div>
            <span class="stat-subtitle" id="water-text">Свежая</span>
            <span class="stat-action-hint" id="water-hint">Нажмите, чтобы налить 💧</span>
          </button>

          <!-- Litter Button -->
          <button class="stat-card action-card" id="btn-care-litter" type="button">
            <div class="stat-header">
              <span class="stat-icon">🚽</span>
              <span class="stat-title">Лоток</span>
            </div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill litter-bar" id="litter-bar" style="width: 100%;"></div>
            </div>
            <span class="stat-subtitle" id="litter-text">Чистый</span>
            <span class="stat-action-hint" id="litter-hint">Нажмите, чтобы убрать ✨</span>
          </button>

          <!-- Play Button -->
          <button class="stat-card action-card" id="btn-care-play" type="button">
            <div class="stat-header">
              <span class="stat-icon">🎾</span>
              <span class="stat-title">Игры</span>
            </div>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill play-bar" id="play-bar" style="width: 80%;"></div>
            </div>
            <span class="stat-subtitle" id="play-text">Поиграли</span>
            <span class="stat-action-hint" id="play-hint">Нажмите, чтобы играть 🐾</span>
          </button>
        </div>
      </section>

      <!-- Cats Info Cards -->
      <section class="cats-section">
        <div class="section-title">Наши любимцы</div>
        <div class="cats-cards-row" id="cats-list-container">
          <!-- Rendered dynamically by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast-notify"></div>

  <script src="/app.js"></script>
</body>
</html>
