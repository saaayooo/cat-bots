services:
  - type: web
    name: koshe4k4bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: cat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: BOT_TIMEZONE
        value: Europe/Moscow
      - key: WEB_APP_URL
        sync: false
